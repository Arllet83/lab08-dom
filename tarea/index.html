<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inscripción al Jardín Infantil</title>
</head>
<body>
    <h1>Inscripción de Nuevos Alumnos</h1>
    <div id="mensajeAlerta"></div>

    <form id="formMatricula">
        <label>Nombre del Niño(a):</label>
        <input type="text" id="inputNombre" placeholder="Ej. Lucas">
        <br><br>

        <label>Edad (años):</label>
        <input type="number" id="inputEdad" placeholder="Ej. 4">
        <br><br>

        <label>Turno:</label>
        <select id="selectTurno">
            <option value="">Seleccione turno</option>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
        </select>
        <br><br>

        <button type="submit" id="btnEnviar">Inscribir</button>
        <button type="button" id="btnClear">Limpiar</button>
    </form>

    <h2>Lista de Inscritos</h2>
    <ul id="listaInscritos"></ul>

    <script src="app.js"></script>
</body>
</html>
